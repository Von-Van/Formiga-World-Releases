name: Ship

# Makes the drafts Build made public, Desktop first, then points the website's downloads at
# them. It checks every draft has all its files before making any of them public.

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Formiga Desktop version, e.g. 0.67.2 (as given to Build)"
        required: true
      hill:
        description: "Formiga Hill version, e.g. 0.1.2 (as given to Build)"
        required: false
      home:
        description: "Formiga Home version, e.g. 0.1.2 (as given to Build)"
        required: false
      battle:
        description: "Formiga Battle version, e.g. 0.67.8 (as given to Build)"
        required: false

# One release at a time, and a second press waits rather than cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

# This repository's own token makes Battle's draft here public.
permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/release.sh ship "$DESKTOP_VERSION" "$HILL_VERSION" "$HOME_VERSION" "$BATTLE_VERSION"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASES_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ inputs.desktop }}
          HILL_VERSION: ${{ inputs.hill }}
          HOME_VERSION: ${{ inputs.home }}
          BATTLE_VERSION: ${{ inputs.battle }}
